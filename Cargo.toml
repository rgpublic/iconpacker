[package]
name = "iconpacker"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
kurbo = "0.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
usvg = { version = "0.48.1", default-features = false }
write-fonts = "0.53.0"
brotli = "9.0.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
